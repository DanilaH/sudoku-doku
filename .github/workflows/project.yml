name: Web, Android and Yandex packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run verify:bank && npm run build && npm run build:yandex
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=1
      - run: cd dist-yandex && zip -r ../sudoku-yandex.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-yandex-screenshots
          path: |
            dist/
            sudoku-yandex.zip
            artifacts/
            reports/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: npm ci && npm run android:sync
      - run: gradle -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
