name: Web, Android and Yandex packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run verify:bank && npm run build && npm run build:yandex
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=1 && npx playwright test -c playwright.yandex.config.ts --workers=1
      - run: cd dist-yandex && zip -r ../sudoku-yandex.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-yandex-screenshots
          path: |
            dist/
            sudoku-yandex.zip
            artifacts/
            reports/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: npm ci && npm run android:sync
      - run: gradle -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - run: mkdir -p artifacts && cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/sudoku-demo.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest -PdisableAds=true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class ru.danilah.sudokudoku.OfflineGameTest#offlineFirstLaunchAndNativeSaveRestore ru.danilah.sudokudoku.debug.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-offline-test.log
            python3 -c 'from pathlib import Path; assert "OK (1 test)" in Path("artifacts/android-offline-test.log").read_text()'
            adb shell am force-stop ru.danilah.sudokudoku.debug
            adb shell am instrument -w -e class ru.danilah.sudokudoku.OfflineGameTest#processDeathRestoresRedoHistory ru.danilah.sudokudoku.debug.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-process-death-test.log
            python3 -c 'from pathlib import Path; assert "OK (1 test)" in Path("artifacts/android-process-death-test.log").read_text()'
            adb pull /sdcard/Android/data/ru.danilah.sudokudoku.debug/files artifacts/android-screenshots
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/sudoku-offline.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sudoku-android-debug
          path: |
            artifacts/*.apk
            artifacts/*.log
            artifacts/android-screenshots/
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-debug.html
