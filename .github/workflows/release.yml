name: RuStore optimized release
run-name: RuStore 0.17 interface refresh and landscape banners
on:
  push:
    branches: [feature/playtest-07]
    paths: ['android/**', 'src/**', 'public/**', 'package*.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: npm ci && npm test && npm run android:sync
      - name: Build unsigned production APK
        env:
          ORG_GRADLE_PROJECT_bannerId: ${{ secrets.YANDEX_BANNER_ID }}
          ORG_GRADLE_PROJECT_rewardedId: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
          ORG_GRADLE_PROJECT_interstitialId: ${{ secrets.YANDEX_INTERSTITIAL_ID }}
          ORG_GRADLE_PROJECT_appMetricaKey: ${{ secrets.APPMETRICA_KEY }}
        run: gradle -p android :app:assembleRelease :app:lintRelease
      - name: Prepare artifacts and local signing tool
        run: |
          mkdir -p artifacts/release
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/release/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" artifacts/release/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            java -jar artifacts/release/apksigner.jar sign --ks android/signing/preview.jks --ks-pass pass:android --key-pass pass:android --out artifacts/production-check.apk artifacts/release/app-release-unsigned.apk
            adb install artifacts/production-check.apk
            adb logcat -c
            adb shell am start -W -n ru.danilah.sudokudoku/.MainActivity
            sleep 15
            adb shell uiautomator dump /sdcard/production-ui.xml
            adb pull /sdcard/production-ui.xml artifacts/release/production-ui.xml
            adb exec-out screencap -p > artifacts/release/production-home.png
            adb logcat -d -s AndroidRuntime:E Capacitor/Console:E Capacitor:E > artifacts/release/production-diagnostics.log
            python3 -c 'from pathlib import Path; ui=Path("artifacts/release/production-ui.xml").read_text(); assert "ru.danilah.sudokudoku" in ui and "android.webkit.WebView" in ui'
            adb logcat -d -s AndroidRuntime:E > artifacts/release/production-crash.log
            python3 -c 'from pathlib import Path; assert "FATAL EXCEPTION" not in Path("artifacts/release/production-crash.log").read_text()'
            adb exec-out screencap -p > artifacts/release/production-home.png
            gradle -p android :app:assembleReleaseSmoke :app:assembleReleaseSmokeAndroidTest -PreleaseSmoke=true
            adb install android/app/build/outputs/apk/releaseSmoke/app-releaseSmoke.apk
            adb install android/app/build/outputs/apk/androidTest/releaseSmoke/app-releaseSmoke-androidTest.apk
            adb shell am instrument -w -e class ru.danilah.sudokudoku.OfflineGameTest#offlineFirstLaunchAndNativeSaveRestore ru.danilah.sudokudoku.releasecheck.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/release/offline.log
            adb logcat -d -s AndroidRuntime:E > artifacts/release/instrumentation-crash.log
            python3 -c 'from pathlib import Path; assert "OK (1 test)" in Path("artifacts/release/offline.log").read_text()'
            adb shell am force-stop ru.danilah.sudokudoku.releasecheck
            adb shell am instrument -w -e class ru.danilah.sudokudoku.OfflineGameTest#processDeathRestoresRedoHistory ru.danilah.sudokudoku.releasecheck.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/release/restore.log
            python3 -c 'from pathlib import Path; assert "OK (1 test)" in Path("artifacts/release/restore.log").read_text()'
            adb shell am instrument -w -e class ru.danilah.sudokudoku.OfflineGameTest#systemBackReturnsHomeAndExits ru.danilah.sudokudoku.releasecheck.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/release/back.log
            python3 -c 'from pathlib import Path; assert "OK (1 test)" in Path("artifacts/release/back.log").read_text()'
            adb shell wm size 1080x2400
            adb shell wm density 320
            adb shell am force-stop ru.danilah.sudokudoku.releasecheck
            adb shell am instrument -w -e class ru.danilah.sudokudoku.OfflineGameTest#nativeBannerMatchesReservedSlot ru.danilah.sudokudoku.releasecheck.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/release/banner-geometry.log
            python3 -c 'from pathlib import Path; assert "OK (1 test)" in Path("artifacts/release/banner-geometry.log").read_text()'
            adb shell svc wifi enable
            adb shell svc data enable
            adb shell am force-stop ru.danilah.sudokudoku.releasecheck
            adb logcat -c
            adb shell am instrument -w -e class ru.danilah.sudokudoku.OfflineGameTest#onlineDemoAdProbe ru.danilah.sudokudoku.releasecheck.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/release/online-demo.log
            adb logcat -d -s DokuAds:I AndroidRuntime:E > artifacts/release/online-ads.log
            adb pull /sdcard/Android/data/ru.danilah.sudokudoku.releasecheck/files artifacts/release/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustore-release-candidate
          path: |
            artifacts/release/
            android/app/build/outputs/mapping/release/
            android/app/build/reports/lint-results-release.html
