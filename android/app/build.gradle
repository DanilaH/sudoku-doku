apply plugin: 'com.android.application'

// Public development-only certificate: stable preview updates, never production signing.
def previewKey = rootProject.file('signing/preview.jks')
previewKey.bytes = rootProject.file('signing/preview-keystore.base64').text.decodeBase64()
android {
    signingConfigs {
        preview {
            storeFile previewKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    namespace = "ru.danilah.sudokudoku"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.danilah.sudokudoku"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "0.13.0"
        buildConfigField "boolean", "ADS_ENABLED", "true"
        buildConfigField "boolean", "FORCE_NO_FILL", "false"
        buildConfigField "String", "BANNER_ID", "\"${project.findProperty('bannerId') ?: ''}\""
        buildConfigField "String", "INTERSTITIAL_ID", "\"${project.findProperty('interstitialId') ?: ''}\""
        buildConfigField "String", "APPMETRICA_KEY", "\"${project.findProperty('appMetricaKey') ?: ''}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testProguardFiles "proguard-test.pro"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testBuildType project.hasProperty('releaseSmoke') ? 'releaseSmoke' : 'debug'
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            signingConfig signingConfigs.preview
            applicationIdSuffix ".debug"
            buildConfigField "boolean", "ADS_ENABLED", "${!project.hasProperty('disableAds')}"
            buildConfigField "boolean", "FORCE_NO_FILL", "${project.hasProperty('forceNoFill')}"
            buildConfigField "String", "BANNER_ID", '"demo-banner-yandex"'
            buildConfigField "String", "INTERSTITIAL_ID", '"demo-interstitial-yandex"'
            buildConfigField "String", "APPMETRICA_KEY", '""'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseSmoke {
            initWith release
            signingConfig signingConfigs.preview
            applicationIdSuffix ".releasecheck"
            matchingFallbacks = ['release']
            buildConfigField "String", "BANNER_ID", '\"demo-banner-yandex\"'
            buildConfigField "String", "INTERSTITIAL_ID", '\"demo-interstitial-yandex\"'
            buildConfigField "String", "APPMETRICA_KEY", '\"\"'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.yandex.android:mobileads:8.6.0"
    implementation("io.appmetrica.analytics:analytics:8.6.0") { exclude group: "io.appmetrica.analytics", module: "analytics-location" }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// A release must never silently contain test ads or lack monetization configuration.
tasks.configureEach { t ->
    if (t.name == 'preReleaseBuild') t.doFirst {
        ['bannerId','interstitialId','appMetricaKey'].each { key ->
            def value = project.findProperty(key)?.toString()
            if (!value || value.startsWith('demo-')) throw new GradleException("Production ${key} is required")
            if (key != 'appMetricaKey' && !(value ==~ /R-M-[0-9]{1,10}-[0-9]{1,7}/))
                throw new GradleException("Production ${key} must be a full Yandex ad unit ID (R-M-PAGE_ID-INDEX), not an app ID")
            if (key == 'appMetricaKey' && !(value ==~ /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/))
                throw new GradleException("Production appMetricaKey must be a UUID")
        }
        if (project.findProperty('bannerId') == project.findProperty('interstitialId'))
            throw new GradleException('Banner and interstitial must use separate ad units')
    }
}
