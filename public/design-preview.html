<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e8ecf2;color:#172238}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}button:focus-visible{outline:3px solid #f39937;outline-offset:3px}.preview{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:16px;background:#fff;border-bottom:1px solid #ccd3dd}.preview strong{margin-right:16px}.preview button{padding:10px 15px;border-radius:6px;background:#edf0f5}.preview button[aria-pressed=true]{background:#172238;color:white}.preview small{width:100%;text-align:center;color:#626c7c}.phone{--bg:#f5f7fc;--surface:#fff;--ink:#192943;--muted:#65738b;--line:#dbe2ed;--major:#7e8ea5;--accent:#245edc;--on:#fff;--area:#edf3ff;--same:#d6e5ff;--selected:#91b6ff;--key:#e6edfa;--error:#c03945;background:var(--bg);color:var(--ink);width:390px;min-height:800px;margin:24px auto;padding:0 16px 22px;border-radius:20px;box-shadow:0 12px 50px #19294318;overflow:hidden}.phone.dark{--bg:#111a2b;--surface:#1b273c;--ink:#eef3ff;--muted:#a2b0c8;--line:#34425b;--major:#8291ab;--accent:#86b2ff;--on:#14203a;--area:#243753;--same:#314f78;--selected:#496da2;--key:#23334e;--error:#ff9398}.phone.b{--bg:#f4f4f2;--surface:#fff;--ink:#252627;--muted:#6b6d70;--line:#dbdcda;--major:#55595e;--accent:#c64b28;--on:#fff;--area:#efefeb;--same:#f7e2d6;--selected:#f3c3a9;--key:#e7e7e3;border-radius:2px}.phone.b.dark{--bg:#1c1d1f;--surface:#26282a;--ink:#f2f1ec;--muted:#aaaead;--line:#424548;--major:#999d9f;--accent:#f4a07a;--on:#252627;--area:#303438;--same:#553f35;--selected:#77513f;--key:#35383a}.top{display:flex;align-items:center;justify-content:space-between;height:70px}.top .brand{font-size:19px;font-weight:750;letter-spacing:-.6px}.top .brand span{color:var(--accent)}.icon{display:inline-grid;place-items:center;width:44px;height:44px;flex-shrink:0}.icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.b .top{border-bottom:1px solid var(--line);margin-bottom:10px}.meta{display:flex;justify-content:space-between;align-items:center;height:46px;font-size:14px;color:var(--muted)}.meta strong{font-weight:600;color:var(--ink)}.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));aspect-ratio:1;border:2px solid var(--major);background:var(--surface)}.cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;display:grid;place-items:center;min-width:0;font-size:27px;font-weight:600;line-height:1}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid var(--major)}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--major)}.cell.area{background:var(--area)}.cell.same{background:var(--same);color:var(--accent)}.cell.entry{color:var(--accent);font-weight:400}.cell.selected{background:var(--selected);box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink)}.cell.notes{font-size:10px;color:var(--muted);padding:3px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-weight:500}.cell.notes span{width:100%;height:100%;display:grid;place-items:center}.b .cell{font-size:26px;font-weight:500}.b .cell.entry{font-weight:400}.b .cell.notes{font-size:10px}.controls{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 12px;gap:8px}.control{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;min-height:67px;border-radius:10px}.control .icon{height:29px}.control.active{background:var(--key);color:var(--accent);font-weight:600}.control .hint{color:var(--accent)}.b .control{border-radius:0}.b .control.active{box-shadow:inset 0 -3px var(--accent)}.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}.key{grid-column:span 2;min-height:55px;position:relative;background:var(--key);color:var(--accent);border-radius:10px;font-size:29px;display:grid;place-items:center;font-weight:500}.key:nth-child(6){grid-column:2/span 2}.key small{position:absolute;right:6px;bottom:5px;font-size:10px;color:var(--muted)}.key.active{background:var(--accent);color:var(--on)}.key.active small{color:var(--on)}.key.done{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}.b .key{border-radius:3px;background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}.b .key.active{background:var(--accent);color:var(--on);box-shadow:none}.b .key.done{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:12px;min-height:40px}.bottom button{min-height:40px;padding:0 8px;display:flex;align-items:center;gap:6px}.bottom svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}.bottom .mode{color:var(--accent);background:var(--area);border-radius:6px}.b .bottom .mode{background:transparent;border-bottom:1px solid var(--major);border-radius:0}.home h1{font-size:44px;line-height:1.05;letter-spacing:-2px;margin:33px 0 30px;font-weight:750}.b .home h1{font-size:45px;letter-spacing:-1.7px;font-weight:650;margin-top:35px}.eyebrow{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px}.resume{background:var(--surface);border-radius:16px;padding:20px;margin-bottom:30px;box-shadow:0 3px 14px #101e3510}.resume-heading{display:flex;align-items:center;justify-content:space-between}.resume h2{font-size:22px;letter-spacing:-.4px;margin:0}.resume .data{color:var(--muted);font-size:14px;margin:10px 0 18px}.progress{height:5px;background:var(--line);border-radius:3px;margin:0 0 18px}.progress span{display:block;width:46%;background:var(--accent);height:100%;border-radius:inherit}.primary{height:54px;width:100%;background:var(--accent);color:var(--on);border-radius:10px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.new h2{font-size:20px;margin:0 0 14px;letter-spacing:-.3px}.levels{display:flex;gap:7px;margin-bottom:14px}.levels button{flex:1;min-height:44px;font-size:13px;border:1px solid var(--line);border-radius:8px}.levels button.active{background:var(--key);color:var(--accent);border-color:var(--accent);font-weight:600}.new>.primary{background:var(--surface);color:var(--accent);border:1px solid var(--line)}.daily{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin:28px 0 0}.daily strong{display:block;font-size:17px;margin-bottom:7px}.daily small{color:var(--muted);font-size:13px}.date-icon{width:46px;height:48px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:21px;font-weight:600;color:var(--accent);margin-right:13px}.date-icon small{font-size:9px;line-height:1;display:block;margin-top:4px;letter-spacing:.8px}.daily>span:nth-child(2){flex:1}.home-nav{display:flex;justify-content:space-around;margin-top:24px}.home-nav button{font-size:13px;min-height:48px;color:var(--muted);display:flex;align-items:center;gap:7px}.home-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}.b .resume{background:transparent;padding:0 0 26px;border-radius:0;box-shadow:none;border-bottom:2px solid var(--major);margin-bottom:26px}.b .primary{border-radius:3px}.b .progress{height:4px}.b .levels{gap:0;border-bottom:1px solid var(--line)}.b .levels button{border:0;border-radius:0}.b .levels button.active{background:transparent;box-shadow:inset 0 -3px var(--accent)}.b .new>.primary{background:var(--surface);color:var(--ink);border-color:var(--major)}.b .date-icon{border-radius:1px;color:var(--ink)}.sheet{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:24px}.sheet.open{display:flex}.sheet article{width:min(100%,350px);padding:24px;border-radius:14px;background:var(--surface);color:var(--ink)}.sheet h2{font-size:23px;margin:0 0 14px}.sheet p{font-size:15px;line-height:1.5;color:var(--muted)}.sheet .primary{margin-top:22px}.toast{min-height:20px;text-align:center;font-size:12px;color:var(--muted);margin-top:4px}.capture .preview{display:none}.capture{background:transparent}.capture .phone{margin:0;box-shadow:none;border-radius:0;min-height:800px;width:390px}.phone.b .game .meta strong:before{content:'●';color:var(--accent);font-size:10px;margin-right:7px}@media(max-width:430px){.phone{width:100%;margin:0;min-height:calc(100dvh - 130px);border-radius:0;box-shadow:none}.capture .phone{width:100%}.cell{font-size:26px}.preview{gap:7px}.preview button{font-size:12px;padding:9px}.preview strong{width:100%;text-align:center;font-size:14px;margin:0}.top{height:62px}.controls{margin-top:14px;gap:4px}.key{min-height:52px}}@media(prefers-reduced-motion:no-preference){button:active{transform:translateY(1px)}}
@media(max-height:700px) and (max-width:430px){.top{height:52px}.meta{height:36px}.game .board{width:min(100%,max(274px,calc(100dvh - 350px)));margin:auto}.controls{margin:12px 0 8px}.control{min-height:58px}.key{min-height:48px}.bottom{margin-top:8px;min-height:36px}.bottom button{min-height:36px}.toast{display:none}}
</style>
<div class="preview"><strong>Макеты интерфейса</strong><button data-switch="a">А · Чёткий игровой</button><button data-switch="b">Б · Графичный</button><button id="theme">Сменить тему</button><button id="screen">Главная / игра</button><small>Интерактивный макет: выбор клеток, ввод и заметки. Сохранения настоящей игры не затрагиваются.</small></div><main class="phone" id="phone"></main>
<script>
const params=new URLSearchParams(location.search);let variant=params.get('v')||'a',dark=params.get('theme')==='dark',screen=params.get('screen')||'game',selected=30,noteMode=false,fast=false,chosen=4;
if(params.has('capture'))document.body.classList.add('capture');
const paths={back:'<path d="m14 5-7 7 7 7"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="m9 3 6 0 1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/>',pause:'<path d="M9 6v12M15 6v12"/>',undo:'<path d="m8 4-4 4 4 4M4 8h9a6 6 0 0 1 0 12"/>',erase:'<path d="m4 13 9-9 7 7-9 9H8zM10 7l7 7M11 20h10"/>',note:'<path d="m5 16 11-11 3 3L8 19l-4 1zM13 8l3 3"/>',hint:'<path d="M8 14a6 6 0 1 1 8 0l-1 3H9zM9 20h6"/>',check:'<path d="m5 12 4 4L19 6"/>',swap:'<path d="M3 7h17l-4-4M21 17H4l4 4"/>',stats:'<path d="M5 20V12M12 20V4M19 20V8"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17v1"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]}</svg>`;
const icon=(n,label,action)=>`<button class="icon" aria-label="${label}" data-action="${action}">${svg(n)}</button>`;
const givens='530070000600195000098000060800060003400803001700020006060000280000419005000080079'.split('').map(Number),entries={2:4,3:6,6:9,12:3,28:5,30:7,32:1,37:2,46:1,50:4,57:7,60:3,65:7,72:3},notes={7:[1,2],8:[2,8],18:[1,2],21:[2,3],23:[2,4],38:[5,6,9],42:[5,7],48:[5,9],54:[1,9],64:[3,8],75:[2,5,6]};const history=[];
function grid(){let target=givens[selected]||entries[selected];return givens.map((given,c)=>{let d=given||entries[c]||0,related=Math.floor(c/9)===Math.floor(selected/9)||c%9===selected%9||Math.floor(c/27)===Math.floor(selected/27)&&Math.floor(c%9/3)===Math.floor(selected%9/3);return `<button data-cell="${c}" aria-label="Строка ${Math.floor(c/9)+1}, столбец ${c%9+1}" class="cell ${given?'':'entry'} ${related?'area':''} ${d&&d===target?'same':''} ${selected===c?'selected':''} ${!d&&notes[c]?'notes':''}">${d|| (notes[c]?Array.from({length:9},(_,i)=>`<span>${notes[c].includes(i+1)?i+1:''}</span>`).join(''):'')}</button>`}).join('')}
function render(){const p=document.getElementById('phone');p.className=`phone ${variant} ${dark?'dark':''}`;p.innerHTML=`<header class="top">${screen==='game'?icon('back','На главную','home'):`<div class="brand">${variant==='a'?'sudoku<span>.</span>':'9 × 9'}</div>`}${screen==='game'?'<div class="brand">Судоку</div>':''}${icon('gear','Настройки','settings')}</header>${screen==='game'?game():home()}<div class="sheet" id="sheet"><article><h2 id="sheet-title"></h2><p id="sheet-text"></p><button class="primary" data-action="close">Продолжить <span>→</span></button></article></div>`;document.querySelectorAll('[data-switch]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.switch===variant)));bind()}
function game(){return `<section class="game"><div class="meta"><strong>Средний</strong><span class="timer">07:24 ${icon('pause','Пауза','pause')}</span></div><div class="board">${grid()}</div><div class="controls">${[['undo','Отмена'],['erase','Стереть'],['note',noteMode?'Заметки вкл.':'Заметки'],['hint','Подсказка']].map(([n,label])=>`<button data-action="${n}" class="control ${n==='note'&&noteMode?'active':''}" ${n==='note'?`aria-pressed="${noteMode}"`:''}><span class="icon ${n==='hint'?'hint':''}">${svg(n)}</span><span>${label}</span></button>`).join('')}</div><div class="keys">${Array.from({length:9},(_,i)=>{let n=i+1,count=9-givens.filter((g,c)=>(g||entries[c])===n).length;return `<button data-digit="${n}" aria-label="Ввести ${n}" class="key ${fast&&chosen===n?'active':''} ${count===0?'done':''}">${n}<small>${count===0?'✓':count}</small></button>`}).join('')}</div><div class="bottom"><button class="mode" data-action="mode">${svg('swap')}${fast?'Цифра → клетки':'Клетка → цифра'}</button><button data-action="check">${svg('check')}Проверить</button></div><div class="toast" role="status">${noteMode?'Заметки включены':fast?'Выберите цифру и нажимайте клетки':''}</div></section>`}
function home(){return `<section class="home"><h1>${variant==='a'?'Судоку':'Судоку'}</h1><div class="resume"><div class="eyebrow">ТЕКУЩАЯ ПАРТИЯ</div><div class="resume-heading"><h2>Средний уровень</h2><span style="color:var(--muted);font-size:14px">46%</span></div><p class="data">07:24 · заполнено 37 из 81</p><div class="progress"><span></span></div><button class="primary" data-action="play">Продолжить <span>→</span></button></div><div class="new"><h2>Новая игра</h2><div class="levels"><button class="active">Лёгкий</button><button>Средний</button><button>Сложный</button></div><button class="primary" data-action="new">Начать игру <span>+</span></button></div><button class="daily" data-action="daily"><span class="date-icon"><small>ОКТ</small>15</span><span><strong>Задача дня</strong><small>Четверг, 15 октября</small></span><span>→</span></button><nav class="home-nav"><button data-action="stats">${svg('stats')}Статистика</button><button data-action="help">${svg('help')}Как играть</button></nav></section>`}
function modal(title,text){document.getElementById('sheet-title').textContent=title;document.getElementById('sheet-text').textContent=text;document.getElementById('sheet').classList.add('open')}
function input(n){if(givens[selected])return;history.push({entries:{...entries},notes:structuredClone(notes)});if(noteMode){if(entries[selected])return;let a=notes[selected]||[];notes[selected]=a.includes(n)?a.filter(x=>x!==n):[...a,n]}else{entries[selected]=entries[selected]===n?0:n;delete notes[selected]}render()}
function bind(){document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{selected=+b.dataset.cell;if(fast)input(chosen);else render()});document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{if(fast){chosen=+b.dataset.digit;render()}else input(+b.dataset.digit)});document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.levels button').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='home'||a==='play'){screen=a==='home'?'home':'game';render()}else if(a==='note'){noteMode=!noteMode;render()}else if(a==='mode'){fast=!fast;render()}else if(a==='erase'){if(!givens[selected]){history.push({entries:{...entries},notes:structuredClone(notes)});delete entries[selected];delete notes[selected];render()}}else if(a==='undo'){let h=history.pop();if(h){Object.keys(entries).forEach(k=>delete entries[k]);Object.assign(entries,h.entries);Object.keys(notes).forEach(k=>delete notes[k]);Object.assign(notes,h.notes);render()}}else if(a==='close')document.getElementById('sheet').classList.remove('open');else if(a==='pause')modal('Пауза','В настоящей игре поле скрывается, а таймер останавливается.');else if(a==='hint')modal('Подсказка','Здесь откроется схема логического шага с объяснением. В этом макете проверяем внешний вид и удобство управления.');else if(a==='settings')modal('Настройки','Светлую и тёмную тему можно переключить в панели над макетом. Остальные настройки перенесём после выбора направления.');else if(a==='new')modal('Начать новую партию?','Текущая партия будет заменена. В макете данные настоящей игры не меняются.');else modal({daily:'Задача дня',stats:'Статистика',help:'Как играть',check:'Проверка'}[a]||'Макет','Этот экран оформим в выбранном стиле. Сейчас сравниваем главную и игровое поле.')})}
document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{variant=b.dataset.switch;render()});document.getElementById('theme').onclick=()=>{dark=!dark;render()};document.getElementById('screen').onclick=()=>{screen=screen==='game'?'home':'game';render()};render();
</script></html>
